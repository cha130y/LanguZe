# Local development infrastructure only. Application processes run on the host via `pnpm dev`.
# Host ports are non-default so LanguZe can run alongside other local PostgreSQL/Maildev instances.
name: languze

services:
  postgres:
    # PostgreSQL 18 with the pgvector extension available (enabled later by migration when RAG lands).
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: languze
      POSTGRES_PASSWORD: languze
      POSTGRES_DB: languze
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    volumes:
      # PostgreSQL 18 images store data under /var/lib/postgresql/<major>/, so mount the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U languze -d languze']
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    # Captures outgoing SMTP mail in development (email verification, password reset).
    image: maildev/maildev:2.2.1
    ports:
      - '${MAILDEV_SMTP_PORT:-1026}:1025'
      - '${MAILDEV_WEB_PORT:-1081}:1080'

  storage:
    # S3-compatible object storage for photos, standing in for Cloudflare R2 (A3).
    # `server -s3` runs master, volume and filer with the S3 gateway in one container,
    # which is all local development needs.
    image: chrislusf/seaweedfs:3.97
    # The identities file makes SeaweedFS check S3 credentials and signatures, the way
    # Cloudflare R2 does. Without it every object would be readable by anyone who can
    # reach the port, and a signed link would prove nothing (P4, NFR-008).
    command: 'server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256'
    ports:
      - '${STORAGE_PORT:-8334}:8333'
    volumes:
      - storage-data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Unauthenticated requests are refused now, so 403 means the gateway is up.
      test:
        [
          'CMD-SHELL',
          'wget -q -S -O /dev/null http://localhost:8333 2>&1 | grep -q "HTTP/"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  storage-data:
